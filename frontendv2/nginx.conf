# Nginx configuration for Next.js frontend under /ciara path
# This can be used as a location block in your main nginx config
# or as a standalone server block

# Option 1: Location block (recommended - add to your main nginx config)
# location /ciara {
#     # Remove /ciara prefix before proxying
#     rewrite ^/ciara/?(.*)$ /$1 break;
