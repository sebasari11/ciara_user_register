# Nginx location block for CIARA Next.js frontend
# Add this to your main nginx server block
# This configuration handles the /ciara path prefix

# Main application location
location /ciara {
    # Remove /ciara prefix before proxying to Next.js
    # This allows Next.js to work normally without basePath configuration
    rewrite ^/ciara/?(.*)$ /$1 break;
    
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ciara;
    
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Handle Next.js static assets (CSS, JS, images)
# These need special handling to preserve the path structure
location ~ ^/ciara/_next/static/(.*)$ {
    rewrite ^/ciara/_next/static/(.*)$ /_next/static/$1 break;
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    
    # Cache static assets
    proxy_cache_valid 200 60m;
    add_header Cache-Control "public, immutable";
}

# Handle Next.js image optimization (if using next/image)
location ~ ^/ciara/_next/image {
    rewrite ^/ciara/_next/image/(.*)$ /_next/image/$1 break;
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Health check endpoint
location /ciara/health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

